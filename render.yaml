services:
  - type: web
    name: reading-share
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node app.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 18.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: reading-db
          property: connectionString

databases:
  - name: reading-db
    plan: free
    region: singapore
