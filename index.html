<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>读书分享打分系统</title>
<style>
:root {
  --primary: #667eea;
  --primary-dark: #5568d3;
  --bg: #f0f2f5;
  --card-bg: #ffffff;
  --text: #1a1a2e;
  --text-light: #666;
  --border: #e0e0e0;
  --star: #f5a623;
  --star-empty: #ddd;
  --success: #48bb78;
  --danger: #e53e3e;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 16px;
  line-height: 1.6;
}
.container { max-width: 800px; margin: 0 auto; }

.header {
  text-align: center; padding: 24px 16px 16px;
  background: linear-gradient(135deg, var(--primary), #764ba2);
  color: white; border-radius: var(--radius); margin-bottom: 20px;
  box-shadow: var(--shadow);
}
.header h1 { font-size: 24px; margin-bottom: 8px; }
.header p { font-size: 14px; opacity: 0.9; }

/* 活动信息栏 */
.session-bar {
  display: flex; gap: 10px; margin-bottom: 20px;
  background: var(--card-bg); padding: 16px;
  border-radius: var(--radius); box-shadow: var(--shadow);
  align-items: center; flex-wrap: wrap;
}
.session-bar label { font-size: 14px; font-weight: 600; white-space: nowrap; }
.session-bar input {
  flex: 1; min-width: 120px; padding: 10px 14px;
  border: 2px solid var(--border); border-radius: 8px;
  font-size: 15px; outline: none;
}
.session-bar input:focus { border-color: var(--primary); }

.btn {
  padding: 10px 20px; border: none; border-radius: 8px;
  font-size: 14px; font-weight: 600; cursor: pointer;
  transition: all 0.2s; white-space: nowrap;
}
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-secondary { background: #edf2f7; color: var(--text); }
.btn-secondary:hover { background: #e2e8f0; }
.btn-small { padding: 6px 14px; font-size: 13px; }

/* 使用说明 */
.help-section {
  background: linear-gradient(135deg, #667eea22, #764ba222);
  border: 2px dashed var(--primary); padding: 20px;
  border-radius: var(--radius); margin-bottom: 20px;
}
.help-header {
  display: flex; justify-content: space-between; align-items: center;
  cursor: pointer; font-size: 16px; font-weight: 600;
  color: var(--primary); user-select: none;
}
.help-toggle { font-size: 14px; transition: transform 0.2s; }
.help-toggle.open { transform: rotate(180deg); }
.help-content { display: none; flex-direction: column; gap: 12px; margin-top: 14px; }
.help-content.show { display: flex; }
.help-item {
  display: flex; align-items: flex-start; gap: 10px;
  font-size: 14px; line-height: 1.7;
}
.help-item .help-num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 24px; height: 24px; min-width: 24px;
  background: var(--primary); color: white;
  border-radius: 50%; font-size: 13px; font-weight: 700;
}

/* 创建活动 */
.create-section {
  background: var(--card-bg); padding: 20px; border-radius: var(--radius);
  box-shadow: var(--shadow); margin-bottom: 20px;
}
.create-section h2 { font-size: 17px; margin-bottom: 12px; }
.create-section input, .create-section textarea {
  width: 100%; padding: 10px 14px; border: 2px solid var(--border);
  border-radius: 8px; font-size: 15px; margin-bottom: 10px;
  outline: none; font-family: inherit;
}
.create-section input:focus, .create-section textarea:focus { border-color: var(--primary); }
.create-section textarea { resize: vertical; min-height: 60px; }

/* 书籍卡片 */
.book-card {
  background: var(--card-bg); border-radius: var(--radius);
  padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow);
}
.book-card .book-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.book-card .book-meta { font-size: 13px; color: var(--text-light); margin-bottom: 12px; }
.book-card .book-desc {
  font-size: 14px; color: #555; margin-bottom: 14px;
  padding: 10px; background: #f7f7f7; border-radius: 8px;
}

/* 星级 */
.stars {
  display: inline-flex; gap: 4px; font-size: 28px;
  cursor: pointer; user-select: none;
}
.stars .star { color: var(--star-empty); transition: color 0.15s, transform 0.1s; }
.stars .star.active { color: var(--star); }
.stars .star:hover { transform: scale(1.15); }
.rating-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.avg-rating { display: flex; align-items: center; gap: 6px; font-size: 14px; }
.avg-stars { font-size: 18px; color: var(--star); letter-spacing: 2px; }
.avg-num { font-weight: 700; font-size: 16px; color: var(--primary); }
.rating-count { font-size: 13px; color: var(--text-light); }

/* 评论 */
.comment-section { margin-top: 16px; }
.comment-section h3 { font-size: 15px; margin-bottom: 10px; }
.comment-input-row { display: flex; gap: 10px; margin-bottom: 12px; }
.comment-input-row textarea {
  flex: 1; padding: 10px 14px; border: 2px solid var(--border);
  border-radius: 8px; font-size: 14px; outline: none;
  font-family: inherit; resize: vertical; min-height: 44px;
}
.comment-input-row textarea:focus { border-color: var(--primary); }
.comment-item {
  padding: 10px 14px; background: #f7f7f7;
  border-radius: 8px; margin-bottom: 8px; font-size: 14px;
}
.comment-item .comment-meta {
  font-size: 12px; color: var(--text-light); margin-bottom: 4px;
  display: flex; align-items: center; gap: 8px;
}
.comment-item .comment-text { word-break: break-word; }
.no-comments { font-size: 13px; color: var(--text-light); font-style: italic; }

/* 统计 */
.stats-bar {
  display: flex; gap: 20px; margin-bottom: 16px; flex-wrap: wrap;
}
.stat-item {
  background: var(--card-bg); padding: 14px 20px; border-radius: var(--radius);
  box-shadow: var(--shadow); text-align: center; flex: 1; min-width: 100px;
}
.stat-item .stat-num { font-size: 24px; font-weight: 700; color: var(--primary); }
.stat-item .stat-label { font-size: 13px; color: var(--text-light); margin-top: 4px; }

/* 实时状态 */
.live-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: #c6f6d5; color: #22543d;
  padding: 4px 12px; border-radius: 20px;
  font-size: 12px; font-weight: 600;
}
.live-badge .dot {
  width: 8px; height: 8px; background: var(--success);
  border-radius: 50%; animation: pulse 1.5s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

/* 分享链接 */
.share-url {
  background: var(--card-bg); padding: 16px; border-radius: var(--radius);
  box-shadow: var(--shadow); margin-bottom: 20px;
  text-align: center;
}
.share-url .url-text {
  width: 100%; padding: 10px; border: 2px solid var(--border);
  border-radius: 8px; font-size: 12px; font-family: monospace;
  background: #f7f7f7; word-break: break-all;
  margin-bottom: 10px;
}

/* Toast */
.toast {
  position: fixed; top: 20px; left: 50%;
  transform: translateX(-50%) translateY(-100px);
  background: var(--text); color: white;
  padding: 12px 24px; border-radius: 8px;
  font-size: 14px; z-index: 9999;
  transition: transform 0.3s;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.error { background: var(--danger); }
.toast.success { background: var(--success); }

/* 空状态 */
.empty-state { text-align: center; padding: 40px 20px; color: var(--text-light); }
.empty-state .emoji { font-size: 48px; margin-bottom: 12px; }

/* 响应式 */
@media (max-width: 600px) {
  body { padding: 10px; }
  .header h1 { font-size: 20px; }
  .session-bar { flex-direction: column; align-items: stretch; }
  .stars { font-size: 24px; }
  .book-card { padding: 16px; }
  .stat-item { min-width: 80px; padding: 10px; }
  .stat-item .stat-num { font-size: 20px; }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📚 读书分享打分系统</h1>
    <p>实时同步 · 匿名评论 · 同一链接共享</p>
  </div>

  <!-- 活动码输入 -->
  <div class="session-bar" id="sessionBar">
    <label>活动码：</label>
    <input type="text" id="sessionInput" placeholder="输入活动码加入…" maxlength="20">
    <button class="btn btn-primary" onclick="joinSession()">加入</button>
    <button class="btn btn-secondary" onclick="showCreateSection()">+ 新建活动</button>
  </div>

  <!-- 使用说明 -->
  <div class="help-section" id="helpSection">
    <div class="help-header" onclick="toggleHelp()">
      <span>📖 使用说明（点击展开）</span>
      <span class="help-toggle" id="helpToggle">▼</span>
    </div>
    <div class="help-content" id="helpContent">
      <div class="help-item">
        <span class="help-num">1</span>
        <div><b>创建活动</b>：点击「新建活动」，输入书名</div>
      </div>
      <div class="help-item">
        <span class="help-num">2</span>
        <div><b>分享给朋友</b>：把页面链接发给朋友，朋友输入活动码即可参与</div>
      </div>
      <div class="help-item">
        <span class="help-num">3</span>
        <div><b>实时同步</b>：所有人打开同一链接，数据自动同步，无需刷新</div>
      </div>
    </div>
  </div>

  <!-- 创建活动 / 添加书籍 -->
  <div class="create-section" id="createSection" style="display:none;">
    <h2 id="createTitle">创建新读书分享活动</h2>
    <input type="text" id="newBookTitle" placeholder="书名（如：活着）" maxlength="100">
    <input type="text" id="newBookAuthor" placeholder="作者（选填）" maxlength="50">
    <textarea id="newBookDesc" placeholder="简介或分享说明（选填）" maxlength="500"></textarea>
    <button class="btn btn-primary" onclick="submitBook()">创建</button>
    <button class="btn btn-secondary" onclick="hideCreateSection()">取消</button>
  </div>

  <!-- 添加书籍按钮（活动内） -->
  <div id="addBookBar" style="display:none; text-align:center; margin-bottom: 16px;">
    <button class="btn btn-secondary" onclick="showAddBookSection()">+ 添加书籍</button>
  </div>

  <!-- 当前活动信息 -->
  <div class="share-url" id="shareUrl" style="display:none;">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
      <span>当前活动码：</span>
      <span class="code-tag" style="background:var(--primary);color:white;padding:4px 12px;border-radius:6px;font-weight:700;font-size:15px;" id="currentCode"></span>
      <span class="live-badge"><span class="dot"></span>实时同步中</span>
    </div>
    <div class="url-text" id="urlDisplay">https://...</div>
    <div style="display:flex;gap:10px;justify-content:center;">
      <button class="btn btn-primary btn-small" onclick="copyUrl()">📋 复制链接</button>
      <button class="btn btn-secondary btn-small" onclick="exitSession()">退出</button>
    </div>
  </div>

  <!-- 统计 -->
  <div class="stats-bar" id="statsBar" style="display:none;">
    <div class="stat-item">
      <div class="stat-num" id="statBooks">0</div>
      <div class="stat-label">分享书籍</div>
    </div>
    <div class="stat-item">
      <div class="stat-num" id="statRatings">0</div>
      <div class="stat-label">参与评分</div>
    </div>
    <div class="stat-item">
      <div class="stat-num" id="statComments">0</div>
      <div class="stat-label">匿名评论</div>
    </div>
    <div class="stat-item">
      <div class="stat-num" id="statAvg">—</div>
      <div class="stat-label">平均星级</div>
    </div>
  </div>

  <!-- 书籍列表 -->
  <div id="bookList">
    <div class="empty-state" id="emptyState">
      <div class="emoji">📖</div>
      <p>输入活动码加入已有分享，或点击「新建活动」开始</p>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// API 基础 URL（部署后自动获取）
const API_URL = window.location.origin;

// 状态
let currentSession = localStorage.getItem('dushu_session') || '';
let currentData = null;
let refreshTimer = null;

// ========== 工具函数 ==========
function showToast(msg, type) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(() => { toast.className = 'toast'; }, 2500);
}

function genId(len) {
  const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
  let id = '';
  for (let i = 0; i < (len || 8); i++) {
    id += chars[Math.floor(Math.random() * chars.length)];
  }
  return id;
}

function formatDate(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return (d.getMonth()+1) + '/' + d.getDate() + ' ' + 
    String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function getFingerprint() {
  let fp = localStorage.getItem('dushu_fp');
  if (!fp) {
    fp = genId(16);
    localStorage.setItem('dushu_fp', fp);
  }
  return fp;
}

function toggleHelp() {
  const content = document.getElementById('helpContent');
  const toggle = document.getElementById('helpToggle');
  content.classList.toggle('show');
  toggle.classList.toggle('open');
}

// ========== API 调用 ==========
async function apiPost(path, body) {
  const resp = await fetch(API_URL + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  return resp.json();
}

async function apiGet(path) {
  const resp = await fetch(API_URL + path);
  if (!resp.ok) throw new Error('API error');
  return resp.json();
}

// ========== 业务逻辑 ==========
let createMode = 'new'; // 'new' or 'add'

function showCreateSection() {
  createMode = 'new';
  document.getElementById('createTitle').textContent = '创建新读书分享活动';
  document.getElementById('createSection').style.display = 'block';
  document.getElementById('newBookTitle').focus();
}

function showAddBookSection() {
  createMode = 'add';
  document.getElementById('createTitle').textContent = '添加书籍';
  document.getElementById('createSection').style.display = 'block';
  document.getElementById('newBookTitle').focus();
}

function hideCreateSection() {
  document.getElementById('createSection').style.display = 'none';
  document.getElementById('newBookTitle').value = '';
  document.getElementById('newBookAuthor').value = '';
  document.getElementById('newBookDesc').value = '';
}

async function submitBook() {
  const title = document.getElementById('newBookTitle').value.trim();
  const author = document.getElementById('newBookAuthor').value.trim();
  const desc = document.getElementById('newBookDesc').value.trim();

  if (!title) {
    showToast('请输入书名', 'error');
    return;
  }

  try {
    if (createMode === 'new') {
      const result = await apiPost('/api/session', { title, author, desc });
      currentSession = result.code;
      localStorage.setItem('dushu_session', currentSession);
      showToast('活动已创建！活动码：' + currentSession, 'success');
    } else {
      await apiPost('/api/session/' + currentSession + '/book', { title, author, desc });
      showToast('书籍已添加！', 'success');
    }

    hideCreateSection();
    await loadSession();
    startAutoRefresh();
  } catch(e) {
    showToast('操作失败，请重试', 'error');
  }
}

async function joinSession() {
  const code = document.getElementById('sessionInput').value.trim().toUpperCase();
  if (!code) {
    showToast('请输入活动码', 'error');
    return;
  }

  try {
    currentSession = code;
    localStorage.setItem('dushu_session', currentSession);
    document.getElementById('sessionInput').value = '';
    await loadSession();
    showToast('已加入活动 ' + code, 'success');
  } catch(e) {
    showToast('活动码不存在', 'error');
    currentSession = '';
    localStorage.removeItem('dushu_session');
  }
}

async function loadSession() {
  if (!currentSession) return;
  
  try {
    currentData = await apiGet('/api/session/' + currentSession);
    renderSession();
  } catch(e) {
    showToast('加载数据失败', 'error');
  }
}

function exitSession() {
  currentSession = '';
  currentData = null;
  localStorage.removeItem('dushu_session');
  stopAutoRefresh();
  renderSession();
}

function copyUrl() {
  const url = window.location.origin + '/?s=' + currentSession;
  navigator.clipboard.writeText(url).then(() => {
    showToast('链接已复制！发给朋友即可', 'success');
  }).catch(() => {
    showToast('请手动复制链接', 'warning');
  });
}

// ========== 评分 ==========
let tempRatings = {};

function setRating(bookId, stars) {
  tempRatings[bookId] = stars;
  const starEls = document.querySelectorAll('[data-book-stars="' + bookId + '"] .star');
  starEls.forEach((el, i) => {
    if (i < stars) el.classList.add('active');
    else el.classList.remove('active');
  });
}

async function submitRating(bookId) {
  const stars = tempRatings[bookId] || 0;
  if (!stars) {
    showToast('请先点击星星选择评分', 'error');
    return;
  }

  try {
    await apiPost('/api/session/' + currentSession + '/book/' + bookId + '/rating', {
      stars,
      fingerprint: getFingerprint()
    });
    await loadSession();
    showToast('评分已提交！', 'success');
  } catch(e) {
    showToast('提交失败', 'error');
  }
}

function getMyRating(book) {
  const fp = getFingerprint();
  const existing = book.ratings.find(r => r.fingerprint === fp);
  return existing ? existing.stars : 0;
}

// ========== 评论 ==========
async function submitComment(bookId) {
  const textarea = document.getElementById('commentInput_' + bookId);
  const text = textarea.value.trim();
  if (!text) {
    showToast('请输入评论内容', 'error');
    return;
  }
  if (text.length > 300) {
    showToast('评论最多300字', 'error');
    return;
  }

  try {
    await apiPost('/api/session/' + currentSession + '/book/' + bookId + '/comment', { text });
    textarea.value = '';
    await loadSession();
    showToast('评论已发布！', 'success');
  } catch(e) {
    showToast('发布失败', 'error');
  }
}

// ========== 自动刷新（智能，不打断用户输入） ==========
function startAutoRefresh() {
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(async () => {
    if (currentSession) {
      // 如果用户正在输入框中打字，跳过本次刷新
      const activeEl = document.activeElement;
      if (activeEl && (activeEl.tagName === 'TEXTAREA' || activeEl.tagName === 'INPUT')) {
        return;
      }
      await loadSession();
    }
  }, 5000); // 每5秒刷新
}

function stopAutoRefresh() {
  if (refreshTimer) {
    clearInterval(refreshTimer);
    refreshTimer = null;
  }
}

// ========== 渲染 ==========
function calcAvg(ratings) {
  if (!ratings || ratings.length === 0) return { avg: 0, count: 0 };
  const sum = ratings.reduce((s, r) => s + r.stars, 0);
  return { avg: (sum / ratings.length).toFixed(1), count: ratings.length };
}

function renderSession() {
  const sessionBar = document.getElementById('sessionBar');
  const statsBar = document.getElementById('statsBar');
  const bookList = document.getElementById('bookList');
  const emptyState = document.getElementById('emptyState');
  const shareUrl = document.getElementById('shareUrl');
  const createSection = document.getElementById('createSection');

  if (!currentSession || !currentData) {
    sessionBar.style.display = 'flex';
    statsBar.style.display = 'none';
    shareUrl.style.display = 'none';
    createSection.style.display = 'none';
    document.getElementById('addBookBar').style.display = 'none';
    bookList.innerHTML = '';
    bookList.appendChild(emptyState);
    emptyState.style.display = 'block';
    return;
  }

  const session = currentData;

  sessionBar.style.display = 'none';
  shareUrl.style.display = 'block';
  createSection.style.display = 'none';
  document.getElementById('addBookBar').style.display = 'block';
  document.getElementById('currentCode').textContent = currentSession;
  document.getElementById('urlDisplay').textContent = window.location.origin + '/?s=' + currentSession;

  // 统计
  let totalRatings = 0;
  let totalComments = 0;
  let allStars = [];
  const books = Object.values(session.books || {}).sort((a,b) => a.createdAt - b.createdAt);
  books.forEach(b => {
    totalRatings += (b.ratings || []).length;
    totalComments += (b.comments || []).length;
    (b.ratings || []).forEach(r => allStars.push(r.stars));
  });
  const overallAvg = allStars.length > 0 ? (allStars.reduce((s,v) => s+v, 0) / allStars.length).toFixed(1) : '—';

  statsBar.style.display = 'flex';
  document.getElementById('statBooks').textContent = books.length;
  document.getElementById('statRatings').textContent = totalRatings;
  document.getElementById('statComments').textContent = totalComments;
  document.getElementById('statAvg').textContent = overallAvg;

  // 渲染书籍
  if (books.length === 0) {
    bookList.innerHTML = '<div class="empty-state"><div class="emoji">📭</div><p>还没有书籍</p></div>';
    return;
  }

  bookList.innerHTML = '';
  books.forEach(book => {
    const { avg, count } = calcAvg(book.ratings);
    const myRating = tempRatings[book.id] || getMyRating(book);

    const card = document.createElement('div');
    card.className = 'book-card';
    card.innerHTML = `
      <div class="book-title">📖 ${escapeHtml(book.title)}</div>
      ${book.author ? `<div class="book-meta">作者：${escapeHtml(book.author)}</div>` : ''}
      ${book.desc ? `<div class="book-desc">${escapeHtml(book.desc)}</div>` : ''}

      <div class="rating-row">
        <div class="stars" data-book-stars="${book.id}">
          ${[1,2,3,4,5].map(s => 
            `<span class="star${s <= myRating ? ' active' : ''}" onclick="setRating('${book.id}', ${s})">★</span>`
          ).join('')}
        </div>
        <button class="btn btn-primary btn-small" onclick="submitRating('${book.id}')">提交评分</button>
      </div>

      <div class="avg-rating">
        <span style="font-size:14px;color:var(--text-light);">大家评分：</span>
        <span class="avg-stars">${'★'.repeat(Math.round(avg))}${'☆'.repeat(5 - Math.round(avg))}</span>
        <span class="avg-num">${avg}</span>
        <span class="rating-count">(${count}人参与)</span>
      </div>

      <div class="comment-section">
        <h3>💬 匿名评论 (${(book.comments || []).length})</h3>
        <div class="comment-input-row">
          <textarea id="commentInput_${book.id}" placeholder="写下你的想法（匿名）…" maxlength="300" 
            onkeydown="if(event.ctrlKey&&event.keyCode===13)submitComment('${book.id}')"></textarea>
          <button class="btn btn-primary btn-small" onclick="submitComment('${book.id}')">发布</button>
        </div>
        <div class="comment-list">
          ${(book.comments || []).length === 0
            ? '<div class="no-comments">还没有评论，来写第一条吧～</div>'
            : book.comments.slice().reverse().map(c => `
              <div class="comment-item">
                <div class="comment-meta">
                  <span>匿名书友</span>
                  <span>${formatDate(c.time)}</span>
                </div>
                <div class="comment-text">${escapeHtml(c.text)}</div>
              </div>
            `).join('')
          }
        </div>
      </div>
    `;
    bookList.appendChild(card);
  });
}

// ========== 初始化 ==========
async function init() {
  // 检查 URL 参数
  const urlParams = new URLSearchParams(window.location.search);
  const urlSession = urlParams.get('s');
  if (urlSession) {
    currentSession = urlSession.toUpperCase();
    localStorage.setItem('dushu_session', currentSession);
  }

  // 如果有保存的活动，自动加入
  if (currentSession) {
    await loadSession();
    startAutoRefresh();
  } else {
    renderSession();
  }
}

init();
</script>
</body>
</html>
